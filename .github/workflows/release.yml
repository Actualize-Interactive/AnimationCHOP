name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos

    runs-on: ${{ matrix.os }}

    steps:
    # anim is a public submodule, so the default checkout token is enough.
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.25'

    - name: Setup uv
      uses: astral-sh/setup-uv@v5

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Configure
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DANIMATIONCHOP_BUILD_TESTS=ON

    - name: Build
      run: cmake --build build --config Release

    # Don't publish a release that fails its own tests.
    - name: Test
      run: ctest --test-dir build --build-config Release --output-on-failure

    # Lay the archive out so it works on unzip: the example project sits beside
    # the Plugins folder, which is the only place TouchDesigner looks for
    # Custom Operators. A user who only wants the operators copies Plugins/
    # into their own project.
    - name: Stage release bundle (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        stage="AnimationCHOP-${{ github.event.release.tag_name }}-windows"
        mkdir -p "$stage/Plugins" "$stage/modules"
        cp build/bin/Release/AnimationCHOP.dll     "$stage/Plugins/"
        cp build/bin/Release/AnimationViewCHOP.dll "$stage/Plugins/"
        cp td/AnimationCHOP.toe "$stage/"
        cp td/Keyframer.tox     "$stage/"
        cp td/animcurves.py     "$stage/"
        cp -r td/modules/.      "$stage/modules/"
        cp README.md LICENSE NOTICE "$stage/"
        7z a "$stage.zip" "$stage"

    - name: Stage release bundle (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        stage="AnimationCHOP-${{ github.event.release.tag_name }}-macos"
        mkdir -p "$stage/Plugins" "$stage/modules"
        cp -R build/bin/AnimationCHOP.plugin     "$stage/Plugins/"
        cp -R build/bin/AnimationViewCHOP.plugin "$stage/Plugins/"
        cp td/AnimationCHOP.toe "$stage/"
        cp td/Keyframer.tox     "$stage/"
        cp td/animcurves.py     "$stage/"
        cp -R td/modules/.      "$stage/modules/"
        cp README.md LICENSE NOTICE "$stage/"
        zip -r "$stage.zip" "$stage"

    - name: Upload release asset
      uses: softprops/action-gh-release@v2
      with:
        files: AnimationCHOP-${{ github.event.release.tag_name }}-${{ matrix.platform }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
