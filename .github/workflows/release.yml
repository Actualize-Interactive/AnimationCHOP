name: Release

on:
  release:
    types: [published]

jobs:
  build-and-release:
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset_name: AnimationCHOP.dll
          - os: macos-latest
            asset_name: AnimationCHOP.dylib
    
    runs-on: ${{ matrix.os }}
    
    steps:
    - name: Generate a token
      id: generate-token
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ vars.AUTH_PULL_REPO_ID }}
        private-key: ${{ secrets.AUTH_PULL_REPO_SECRET }}
        owner: Actualize-Interactive
        repositories: AnimationCHOP,anim

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        token: ${{ steps.generate-token.outputs.token }}
      
    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.25'
        
    - name: Setup Python (Windows)
      if: runner.os == 'Windows'
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Setup Python (macOS)
      if: runner.os == 'macOS'
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release
        
    - name: Configure CMake (macOS)
      if: runner.os == 'macOS'
      run: |
        mkdir build
        cd build
        # Find Python and set CMAKE variables
        python3-config --cflags
        python3-config --ldflags
        cmake .. -DCMAKE_BUILD_TYPE=Release
        
    - name: Build project (Windows)
      if: runner.os == 'Windows'
      run: |
        cd build
        cmake --build . --config Release
        echo "Listing build outputs:"
        dir bin
        
    - name: Build project (macOS)
      if: runner.os == 'macOS'
      run: |
        cd build
        cmake --build . --config Release
        echo "Listing build outputs:"
        ls -la bin/
        
    - name: Upload Release Asset (Windows)
      if: runner.os == 'Windows'
      uses: softprops/action-gh-release@v1
      with:
        files: |
          build/bin/Release/AnimationCHOP.dll
          build/bin/Release/AnimationViewCHOP.dll
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Upload Release Asset (macOS)
      if: runner.os == 'macOS'
      uses: softprops/action-gh-release@v1
      with:
        files: |
          build/bin/AnimationCHOP.dylib
          build/bin/AnimationViewCHOP.dylib
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}