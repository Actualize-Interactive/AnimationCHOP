name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Build, test and package on every platform as the release gate. Ubuntu is
  # absent on purpose: TouchDesigner ships on Windows and macOS only.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
    # anim is a public submodule, so the default checkout token is enough.
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.25'

    - name: Setup uv
      uses: astral-sh/setup-uv@v5

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Configure
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DANIMATIONCHOP_BUILD_TESTS=ON

    - name: Build
      run: cmake --build build --config Release

    # Don't publish a release that fails its own tests.
    - name: Test
      run: ctest --test-dir build --build-config Release --output-on-failure

    # Lay the archive out so it works on unzip: the example project sits beside
    # the Plugins folder, which is the only place TouchDesigner looks for Custom
    # Operators. A user who only wants the operators copies Plugins/ into their
    # own project.
    - name: Package
      shell: bash
      run: |
        version="${GITHUB_REF_NAME:-dev}"
        stage="AnimationCHOP-${version}-${{ matrix.platform }}"
        mkdir -p "$stage/Plugins" "$stage/modules"

        if [ "${{ matrix.platform }}" = "windows" ]; then
          cp build/bin/Release/AnimationCHOP.dll     "$stage/Plugins/"
          cp build/bin/Release/AnimationViewCHOP.dll "$stage/Plugins/"
        else
          cp -R build/bin/AnimationCHOP.plugin     "$stage/Plugins/"
          cp -R build/bin/AnimationViewCHOP.plugin "$stage/Plugins/"
        fi

        cp td/AnimationCHOP.toe "$stage/"
        cp td/Keyframer.tox     "$stage/"
        cp td/animcurves.py     "$stage/"
        cp -R td/modules/.      "$stage/modules/"
        cp README.md LICENSE NOTICE CHANGELOG.md "$stage/"

        # zip is present on both runners; 7z is not on macOS.
        if [ "${{ matrix.platform }}" = "windows" ]; then
          7z a "$stage.zip" "$stage" > /dev/null
        else
          zip -qr "$stage.zip" "$stage"
        fi

    - name: Upload package
      uses: actions/upload-artifact@v4
      with:
        name: package-${{ matrix.platform }}
        path: AnimationCHOP-*-${{ matrix.platform }}.zip
        if-no-files-found: error

  # Publish the release.
  #
  # Only runs for tag pushes. A release cannot be published from a branch, so on
  # workflow_dispatch this job is skipped and the workflow acts as a dry run of
  # the cross-platform build, test and packaging gate above.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Download packages
      uses: actions/download-artifact@v4
      with:
        pattern: package-*
        merge-multiple: true

    # Use the CHANGELOG entry for this tag as the release body, so the notes are
    # written once and reviewed in the pull request that introduced them.
    - name: Extract release notes from CHANGELOG
      run: |
        version="${GITHUB_REF_NAME#v}"
        # Match the heading by prefix rather than by regex: a version string
        # interpolated into a regex turns "[0.4.0]" into a character class, and
        # whether the escaping survives depends on the awk in use (mawk keeps
        # the backslash, gawk drops it and silently matches nothing).
        awk -v head="## [$version]" '
          index($0, head) == 1      { found = 1; next }  # heading for this version
          found && index($0, "## [") == 1 { exit }       # next version heading
          found && /^\[.*\]: /      { exit }             # link reference block
          found && index($0, "<!--") == 1 { exit }       # trailing comments
          found                     { print }
        ' CHANGELOG.md \
          | sed -e '/./,$!d' -e :a -e '/^\n*$/{$d;N;};/\n$/ba' > RELEASE_NOTES.md

        if [ ! -s RELEASE_NOTES.md ]; then
          echo "::error::CHANGELOG.md has no '## [$version]' section. Add one before tagging $GITHUB_REF_NAME." >&2
          exit 1
        fi
        echo "Release notes for $version:"
        cat RELEASE_NOTES.md

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: AnimationCHOP-*.zip
        name: Release ${{ github.ref_name }}
        body_path: RELEASE_NOTES.md
        generate_release_notes: true
        draft: false
        prerelease: false
